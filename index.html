<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZE Collection</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Library Pinch-to-Zoom Touch Gesture -->
  <script src="https://cdn.jsdelivr.net/npm/panzoom@9.4.3/dist/panzoom.min.js"></script>
</head>
<body>

  <header>
    <h1>ZE Collection</h1>
  </header>

  <main>
    <!-- Tampilan Daftar Folder -->
    <div id="folder-view" class="folder-list"></div>

    <!-- Tampilan Isi Galeri -->
    <div id="gallery-view" class="hidden">
      <div class="gallery-header">
        <button id="back-btn">← Kembali</button>
        <h2 id="current-folder-title"></h2>
      </div>
      <div id="media-grid" class="grid-container"></div>
    </div>
  </main>

  <!-- Modal Lightbox (Viewer Foto/Video dengan Zoom Jari) -->
  <div id="lightbox" class="lightbox hidden">
    <button class="close-btn" id="lightbox-close">&times;</button>
    <a id="download-btn" class="download-btn" download target="_blank">⬇ Download File</a>
    
    <div class="lightbox-content-wrapper">
      <div id="zoom-target" class="zoom-target">
        <!-- Elemen img atau video akan dimasukkan via JS di sini -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
