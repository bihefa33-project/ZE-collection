<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZE Collection</title>
  
  <!-- Library Pinch-to-Zoom Touch Gesture -->
  <script src="https://cdn.jsdelivr.net/npm/panzoom@9.4.3/dist/panzoom.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 12px;
    }

    header h1 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 1.4rem;
      color: #00adb5;
    }

    /* Kunci penyembunyian tampilan */
    .hidden {
      display: none !important;
    }

    /* Tampilan Daftar Folder */
    .folder-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .folder-card {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .folder-card:active {
      background: #00adb5;
    }

    /* Header Galeri & Tombol Kembali */
    .gallery-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    #back-btn {
      background: #00adb5;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
    }

    /* Grid 3 Kolom Presisi untuk Mode HP */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .media-item {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #000;
      border-radius: 4px;
    }

    .media-item img,
    .media-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Lightbox Modal (Zoom Fullscreen) */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 28px;
      color: white;
      background: rgba(255,255,255,0.2);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      z-index: 10000;
    }

    .download-btn {
      position: absolute;
      bottom: 20px;
      background: #00adb5;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      z-index: 10000;
    }

    .lightbox-content-wrapper {
      width: 100vw;
      height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zoom-target {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zoom-target img,
    .zoom-target video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <header>
    <h1>ZE Collection</h1>
  </header>

  <main>
    <!-- Daftar Folder -->
    <div id="folder-view" class="folder-list"></div>

    <!-- Tampilan Galeri -->
    <div id="gallery-view" class="hidden">
      <div class="gallery-header">
        <button id="back-btn">← Kembali</button>
        <h3 id="current-folder-title"></h3>
      </div>
      <div id="media-grid" class="grid-container"></div>
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox hidden">
    <button class="close-btn" id="lightbox-close">&times;</button>
    <a id="download-btn" class="download-btn" download target="_blank">⬇ Download File</a>
    
    <div class="lightbox-content-wrapper">
      <div id="zoom-target" class="zoom-target"></div>
    </div>
  </div>

  <script>
    const USERNAME = 'bihefa33-project';
    const REPO = 'ZE-collection';

    const folders = [
      { name: '1. Generate sendiri full NDS', path: 'media/generate-sendiri-full-nds' },
      { name: '2. Generate publik full NDS', path: 'media/generate-publik-full-nds' },
      { name: '3. Generate sendiri half NDS', path: 'media/generate-sendiri-half-nds' },
      { name: '4. Generate publik half NDS', path: 'media/generate-publik-half-nds' },
      { name: '5. AI edit sendiri', path: 'media/ai-edit-sendiri' },
      { name: '6. AI edit publik', path: 'media/ai-edit-publik' },
      { name: '7. AI edit random', path: 'media/ai-edit-random' },
      { name: '8. Video AI sendiri', path: 'media/video-ai-sendiri' },
      { name: '9. Video AI publik', path: 'media/video-ai-publik' },
      { name: '10. Real jeketi', path: 'media/real-jeketi' },
      { name: '11. Real random', path: 'media/real-random' }
    ];

    const folderView = document.getElementById('folder-view');
    const galleryView = document.getElementById('gallery-view');
    const mediaGrid = document.getElementById('media-grid');
    const backBtn = document.getElementById('back-btn');
    const folderTitle = document.getElementById('current-folder-title');

    const lightbox = document.getElementById('lightbox');
    const lightboxClose = document.getElementById('lightbox-close');
    const zoomTarget = document.getElementById('zoom-target');
    const downloadBtn = document.getElementById('download-btn');

    let panzoomInstance = null;

    function renderFolders() {
      folderView.innerHTML = '';
      folders.forEach(folder => {
        const card = document.createElement('div');
        card.className = 'folder-card';
        card.innerHTML = `📁 ${folder.name}`;
        card.onclick = () => loadFolderContent(folder);
        folderView.appendChild(card);
      });
    }

    async function loadFolderContent(folder) {
      folderView.classList.add('hidden');
      galleryView.classList.remove('hidden');
      folderTitle.innerText = folder.name;
      mediaGrid.innerHTML = '<p style="grid-column: span 3; text-align:center;">Memuat file...</p>';

      const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${folder.path}`;

      try {
        const response = await fetch(apiUrl);
        if (response.status === 404) {
          throw new Error('Folder belum ada atau Repositori berstatus Private.');
        }
        if (!response.ok) throw new Error('Gagal memuat API');
        
        const files = await response.json();
        mediaGrid.innerHTML = '';

        files.forEach(file => {
          if (file.name.startsWith('.')) return; // Abaikan .gitkeep

          const ext = file.name.split('.').pop().toLowerCase();
          const isImg = ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext);
          const isVid = ['mp4', 'webm', 'mov'].includes(ext);

          if (isImg || isVid) {
            const item = document.createElement('div');
            item.className = 'media-item';

            if (isImg) {
              item.innerHTML = `<img src="${file.download_url}" loading="lazy">`;
              item.onclick = () => openLightbox(file.download_url, 'image');
            } else if (isVid) {
              item.innerHTML = `<video src="${file.download_url}#t=0.1" preload="metadata"></video>`;
              item.onclick = () => openLightbox(file.download_url, 'video');
            }
            mediaGrid.appendChild(item);
          }
        });

        if (mediaGrid.children.length === 0) {
          mediaGrid.innerHTML = '<p style="grid-column: span 3; text-align:center;">Belum ada foto/video di folder ini.</p>';
        }
      } catch (err) {
        mediaGrid.innerHTML = `<p style="grid-column: span 3; text-align:center; color:#ff6b6b; padding:10px;">${err.message}</p>`;
      }
    }

    backBtn.onclick = () => {
      galleryView.classList.add('hidden');
      folderView.classList.remove('hidden');
      mediaGrid.innerHTML = ''; 
    };

    function openLightbox(url, type) {
      lightbox.classList.remove('hidden');
      zoomTarget.innerHTML = '';
      downloadBtn.href = url;

      let el;
      if (type === 'image') {
        el = document.createElement('img');
        el.src = url;
      } else {
        el = document.createElement('video');
        el.src = url;
        el.controls = true;
        el.autoplay = true;
        el.playsInline = true;
      }

      zoomTarget.appendChild(el);

      if (panzoomInstance) panzoomInstance.dispose();
      panzoomInstance = Panzoom(zoomTarget, {
        maxScale: 5,
        minScale: 1,
        contain: 'inside'
      });
    }

    lightboxClose.onclick = () => {
      lightbox.classList.add('hidden');
      zoomTarget.innerHTML = '';
      if (panzoomInstance) panzoomInstance.dispose();
    };

    renderFolders();
  </script>
</body>
  </html>
